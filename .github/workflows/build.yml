name: Build App
run-name: Upload existing Model Load IPA to Loadly

on:
  workflow_dispatch:
    inputs:
      os:
        type: choice
        description: Runner image (iOS requires macos-26; Windows requires windows-latest)
        required: true
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - macos-26
          - windows-latest
      platform:
        type: choice
        description: Platform to build
        required: true
        default: android
        options:
          - android
          - ios
          - windows
      profile:
        type: choice
        description: EAS build profile
        required: true
        default: development
        options:
          - development
          - simulator
          - preview
          - testflight
          - production
      repo:
        type: string
        description: App repository name
        required: true
      branch:
        type: string
        description: App branch, tag, or commit SHA
        required: true
        default: master
      artifact:
        type: choice
        description: Post-build action
        required: true
        default: upload
        options:
          - none
          - upload
          - submit
          - loadlyio
      key:
        type: string
        description: Shared build access key
        required: true

permissions:
  contents: read
  actions: read

jobs:
  upload-existing-ipa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate upload request
        env:
          PROVIDED_KEY: ${{ inputs.key }}
          EXPECTED_KEY: ${{ secrets.KEY }}
        run: |
          test -n "$EXPECTED_KEY"
          test "$PROVIDED_KEY" = "$EXPECTED_KEY"
          test '${{ inputs.platform }}' = ios
          test '${{ inputs.artifact }}' = loadlyio
      - name: Checkout upload helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: builder
          persist-credentials: false
      - name: Download already signed IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 43549703964 --repo nhchuongchkst19/app-build --name mobile-apps-ios-development-2510 --dir download
      - name: Verify and upload IPA to Loadly
        env:
          LOADLYIO_TOKEN: ${{ secrets.LOADLYIO_TOKEN }}
        run: python3 builder/.github/scripts/upload-model-load-ipa.py
      - name: Save installation result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: model-load-ios-loadly-result
          path: release.json
          retention-days: 7
