name: Desktop Agent Session
run-name: desktop-agent-session | ${{ inputs.session_id }} | ${{ inputs.platform }} | ${{ inputs.framework }} | ${{ inputs.owner }}/${{ inputs.repo }}@${{ inputs.branch }}

on:
  workflow_dispatch:
    inputs:
      repo:
        description: App repository name
        type: string
        required: true
      owner:
        description: App repository owner; blank uses existing USER secret
        type: string
      branch:
        description: App branch, tag or full commit SHA
        type: string
        default: main
        required: true
      platform:
        type: choice
        options: [windows, macos]
        default: windows
        required: true
      framework:
        type: choice
        options: [electron, tauri]
        default: electron
        required: true
      project_path:
        description: Desktop project path relative to the source repository
        type: string
        default: .
        required: true
      session_id:
        description: Unique UUID generated by runnerctl; no secret token inputs
        type: string
        required: true
      prepare_app:
        description: Install dependencies as a recoverable worker command
        type: boolean
        default: true
      max_minutes:
        description: Session lifetime, 5 to 330 minutes
        type: number
        default: 120
      idle_minutes:
        description: Stop after this many minutes without authenticated activity (1 to 60)
        type: number
        default: 15

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-agent-session-${{ inputs.session_id }}
  cancel-in-progress: false

jobs:
  session:
    runs-on: ${{ inputs.platform == 'windows' && 'windows-latest' || 'macos-latest' }}
    timeout-minutes: 360
    env:
      CI: 'true'
      SESSION_KIND: desktop
      PLATFORM: ${{ inputs.platform }}
      DESKTOP_FRAMEWORK: ${{ inputs.framework }}
      PROJECT_PATH: ${{ inputs.project_path }}
      APP_OWNER: ${{ inputs.owner || secrets.USER }}
      APP_REPO: ${{ inputs.repo }}
      SESSION_ID: ${{ inputs.session_id }}
      MAX_MINUTES: ${{ inputs.max_minutes }}
      IDLE_MINUTES: ${{ inputs.idle_minutes }}
      PREPARE_APP: ${{ inputs.prepare_app }}

    steps:
      - name: Validate session inputs
        shell: bash
        env:
          ROOT_KEY: ${{ secrets.KEY }}
        run: |
          set -euo pipefail
          [[ -n "$ROOT_KEY" ]] || { echo 'Repository secret KEY is missing'; exit 1; }
          [[ "$APP_OWNER" =~ ^[A-Za-z0-9-]+$ ]]
          [[ "$APP_REPO" =~ ^[A-Za-z0-9._-]+$ && "$APP_REPO" != '.' && "$APP_REPO" != '..' ]]
          [[ "$SESSION_ID" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$ ]]
          [[ "$MAX_MINUTES" =~ ^[0-9]+$ && "$MAX_MINUTES" -ge 5 && "$MAX_MINUTES" -le 330 ]]
          [[ "$IDLE_MINUTES" =~ ^[0-9]+$ && "$IDLE_MINUTES" -ge 1 && "$IDLE_MINUTES" -le 60 ]]
          [[ "$PROJECT_PATH" != /* && ! "$PROJECT_PATH" =~ (^|/)\.\.(/|$) && "$PROJECT_PATH" =~ ^[A-Za-z0-9._/-]+$ ]]

      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: builder
          persist-credentials: false

      - name: Checkout target app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.APP_OWNER }}/${{ inputs.repo }}
          ref: ${{ inputs.branch }}
          token: ${{ secrets.GH_TOKEN }}
          path: app
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3

      - name: Install control-plane dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          (cd builder/tools/runner-control && pnpm install --frozen-lockfile)
          echo "APP_SOURCE_SHA=$(git -C app rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Configure session paths on Windows
        if: inputs.platform == 'windows'
        shell: pwsh
        run: |
          $env:SESSION_STATE_DIR = (($env:RUNNER_TEMP -replace '\\', '/') + '/runner-control')
          "SESSION_STATE_DIR=$env:SESSION_STATE_DIR" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & builder/.github/scripts/runner-control/setup-tools.ps1

      - name: Configure session paths on macOS
        if: inputs.platform == 'macos'
        shell: bash
        run: |
          export SESSION_STATE_DIR="$RUNNER_TEMP/runner-control"
          echo "SESSION_STATE_DIR=$RUNNER_TEMP/runner-control" >> "$GITHUB_ENV"
          bash builder/.github/scripts/runner-control/setup-tools.sh

      - name: Run desktop control session
        uses: ./builder/tools/runner-control
        env:
          RUNNER_KEY: ${{ secrets.KEY }}

      - name: Upload session evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runner-${{ inputs.session_id }}-results
          path: |
            ${{ runner.temp }}/runner-control
            results/
          if-no-files-found: warn
          retention-days: 7

      - name: Write session summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$SESSION_STATE_DIR/result.json" ]]; then
            node builder/tools/runner-control/src/summary.mjs >> "$GITHUB_STEP_SUMMARY"
          fi
