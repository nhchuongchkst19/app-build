name: Expo Agent Session
run-name: agent-session | ${{ inputs.session_id }} | ${{ inputs.platform }} | ${{ inputs.owner }}/${{ inputs.repo }}@${{ inputs.branch }}
on:
  workflow_dispatch:
    inputs:
      repo:
        description: App repository name
        type: string
        required: true
      owner:
        description: App repository owner; blank uses existing USER secret
        type: string
      branch:
        description: App branch, tag or full commit SHA
        type: string
        default: main
        required: true
      platform:
        type: choice
        options: [android, ios]
        default: android
        required: true
      profile:
        description: Initial build configuration (agent can override commands)
        type: choice
        options: [development, release]
        default: development
      app_id:
        description: Android package or iOS bundle ID (optional)
        type: string
      session_id:
        description: Unique UUID generated by runnerctl; no secret token inputs
        type: string
        required: true
      prepare_app:
        description: Start dependency installation and prebuild as a recoverable worker command
        type: boolean
        default: true
      max_minutes:
        description: Session lifetime, 5 to 330 minutes
        type: number
        default: 120
      idle_minutes:
        description: Stop after this many minutes without authenticated activity (1 to 60)
        type: number
        default: 15
      api_level:
        description: Android emulator API level
        type: string
        default: '35'
permissions:
  contents: read
  actions: read
concurrency:
  group: agent-session-${{ inputs.session_id }}
  cancel-in-progress: false
jobs:
  session:
    runs-on: ${{ inputs.platform == 'ios' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      PLATFORM: ${{ inputs.platform }}
      BUILD_PROFILE: ${{ inputs.profile }}
      APP_OWNER: ${{ inputs.owner || secrets.USER }}
      APP_REPO: ${{ inputs.repo }}
      APP_ID: ${{ inputs.app_id }}
      SESSION_ID: ${{ inputs.session_id }}
      MAX_MINUTES: ${{ inputs.max_minutes }}
      IDLE_MINUTES: ${{ inputs.idle_minutes }}
      PREPARE_APP: ${{ inputs.prepare_app }}
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - name: Validate session inputs
        env:
          ROOT_KEY: ${{ secrets.KEY }}
          API_LEVEL: ${{ inputs.api_level }}
        run: |
          set -euo pipefail
          [[ -n "$ROOT_KEY" ]] || { echo 'Repository secret KEY is missing'; exit 1; }
          [[ "$APP_OWNER" =~ ^[A-Za-z0-9-]+$ ]]
          [[ "$APP_REPO" =~ ^[A-Za-z0-9._-]+$ && "$APP_REPO" != '.' && "$APP_REPO" != '..' ]]
          [[ "$SESSION_ID" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$ ]]
          [[ "$MAX_MINUTES" =~ ^[0-9]+$ && "$MAX_MINUTES" -ge 5 && "$MAX_MINUTES" -le 330 ]]
          [[ "$IDLE_MINUTES" =~ ^[0-9]+$ && "$IDLE_MINUTES" -ge 1 && "$IDLE_MINUTES" -le 60 ]]
          [[ "$API_LEVEL" =~ ^[0-9]{2}$ ]]
          echo "SESSION_STATE_DIR=$RUNNER_TEMP/runner-control" >> "$GITHUB_ENV"
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: builder
          persist-credentials: false
      - name: Checkout target app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.APP_OWNER }}/${{ inputs.repo }}
          ref: ${{ inputs.branch }}
          token: ${{ secrets.GH_TOKEN }}
          path: app
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x
      - name: Setup Java
        if: inputs.platform == 'android'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle cache
        if: inputs.platform == 'android'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-disabled: ${{ !github.event.repository.private }}
      - name: Install control-plane dependencies and tools
        run: |
          set -euo pipefail
          corepack enable
          (cd builder/tools/runner-control && pnpm install --frozen-lockfile)
          bash builder/.github/scripts/runner-control/setup-tools.sh
          echo "APP_SOURCE_SHA=$(git -C app rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Enable Android acceleration
        if: inputs.platform == 'android'
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android control session with persistent emulator
        if: inputs.platform == 'android'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          RUNNER_KEY: ${{ secrets.KEY }}
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 2048M
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash builder/.github/scripts/runner-control/run-session.sh
      - name: Boot iOS simulator
        if: inputs.platform == 'ios'
        run: bash builder/.github/scripts/runner-control/boot-ios.sh
      - name: Run iOS control session
        if: inputs.platform == 'ios'
        uses: ./builder/tools/runner-control
        env:
          RUNNER_KEY: ${{ secrets.KEY }}
      - name: Stop remaining session processes
        if: always()
        run: |
          if [[ "$PLATFORM" == android ]]; then adb emu kill || true; fi
          if [[ "$PLATFORM" == ios && -f "$SESSION_STATE_DIR/simulator-id" ]]; then
            xcrun simctl shutdown "$(cat "$SESSION_STATE_DIR/simulator-id")" || true
          fi
      - name: Upload session evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runner-${{ inputs.session_id }}-results
          path: |
            ${{ runner.temp }}/runner-control
            results/
          if-no-files-found: warn
          retention-days: 7
      - name: Write session summary
        if: always()
        run: |
          if [[ -f "$SESSION_STATE_DIR/result.json" ]]; then
            node builder/tools/runner-control/src/summary.mjs >> "$GITHUB_STEP_SUMMARY"
          fi
