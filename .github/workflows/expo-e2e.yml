name: Expo Build and Test
run-name: expo-e2e | ${{ inputs.platform }} | ${{ inputs.mode }} | ${{ inputs.repo }}@${{ inputs.branch }}

on:
  workflow_dispatch:
    inputs:
      repo:
        description: App repository name under the existing USER secret
        type: string
        required: true
      branch:
        description: App source branch, tag or SHA (full SHA recommended)
        type: string
        default: main
        required: true
      platform:
        type: choice
        options: [android, ios]
        default: android
        required: true
      mode:
        description: Build only, reuse a binary to test, or build then test
        type: choice
        options: [build-test, build, test]
        default: build-test
        required: true
      binary_run:
        description: Completed binary-producing run ID; UI tests may have failed (test mode)
        type: string
      test_ref:
        description: Test script ref in the same app repo; blank uses branch
        type: string
      flow_path:
        description: Maestro flow or directory relative to test checkout
        type: string
        default: .maestro
        required: true
      app_id:
        description: Expected Android package or iOS bundle identifier
        type: string
        required: true
      ios_scheme:
        description: Xcode scheme; blank uses the only shared app scheme
        type: string
      key:
        description: Existing shared build access key
        type: string
        required: true

permissions:
  contents: read
  actions: read

# Never cancel a build implicitly when a test is dispatched.
concurrency:
  group: expo-e2e-${{ inputs.repo }}-${{ inputs.platform }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  expo:
    runs-on: ${{ inputs.platform == 'ios' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      PLATFORM: ${{ inputs.platform }}
      MODE: ${{ inputs.mode }}
      APP_REPO: ${{ inputs.repo }}
      APP_ID: ${{ inputs.app_id }}
      FLOW_PATH: ${{ inputs.flow_path }}
      IOS_SCHEME: ${{ inputs.ios_scheme }}
      BINARY_RUN: ${{ inputs.binary_run }}
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - name: Validate authorization and inputs
        env:
          PROVIDED_KEY: ${{ inputs.key }}
          EXPECTED_KEY: ${{ secrets.KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$EXPECTED_KEY" || "$PROVIDED_KEY" != "$EXPECTED_KEY" ]]; then
            echo 'Invalid or missing build access key.' >&2; exit 1
          fi
          [[ "$APP_REPO" =~ ^[A-Za-z0-9._-]+$ && "$APP_REPO" != '.' && "$APP_REPO" != '..' ]]
          [[ "$APP_ID" =~ ^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z0-9_]+)+$ ]]
          if [[ "$MODE" == test ]]; then [[ "$BINARY_RUN" =~ ^[0-9]+$ ]]; fi
      - name: Checkout build tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: builder
          persist-credentials: false
      - name: Checkout app source
        if: inputs.mode != 'test'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ secrets.USER }}/${{ inputs.repo }}
          ref: ${{ inputs.branch }}
          token: ${{ secrets.GH_TOKEN }}
          path: app
          persist-credentials: false
      - name: Checkout test scripts independently
        if: inputs.mode != 'build'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ secrets.USER }}/${{ inputs.repo }}
          ref: ${{ inputs.test_ref || inputs.branch }}
          token: ${{ secrets.GH_TOKEN }}
          path: test-source
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x
      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle cache
        if: inputs.platform == 'android' && inputs.mode != 'test'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-disabled: ${{ !github.event.repository.private }}
      - name: Prepare output and validate flow path
        run: bash builder/.github/scripts/expo-e2e/prepare.sh
      - name: Install app dependencies and generate native project if absent
        if: inputs.mode != 'test'
        run: node builder/.github/scripts/expo-e2e/prepare-app.cjs
      - name: Resolve toolchain cache identity
        if: inputs.mode != 'test'
        id: toolchain
        run: |
          set -euo pipefail
          if [[ "$PLATFORM" == ios ]]; then
            identity="$(xcodebuild -version)-$(xcrun --sdk iphonesimulator --show-sdk-version)"
          else
            identity="$(java -version 2>&1)"
          fi
          digest=$(printf '%s' "$identity" | shasum -a 256 | cut -d' ' -f1)
          echo "id=$digest" >> "$GITHUB_OUTPUT"
      - name: Restore native build outputs (private builder only)
        if: inputs.mode != 'test' && github.event.repository.private
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            app/android/.gradle
            app/android/build
            app/android/app/build
            app/.expo-e2e-derived
            app/ios/Pods
            ~/Library/Caches/CocoaPods
          key: expo-e2e-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.repo }}-${{ inputs.platform }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('app/pnpm-lock.yaml', 'app/package-lock.json', 'app/yarn.lock', 'app/app.json', 'app/app.config.*', 'app/ios/Podfile*', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            expo-e2e-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.repo }}-${{ inputs.platform }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('app/pnpm-lock.yaml', 'app/package-lock.json', 'app/yarn.lock', 'app/app.json', 'app/app.config.*', 'app/ios/Podfile*', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}-
      - name: Build standalone emulator or simulator binary
        if: inputs.mode != 'test'
        run: node builder/.github/scripts/expo-e2e/build.cjs
      - name: Upload reusable binary before UI tests
        if: inputs.mode != 'test'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: expo-e2e-${{ inputs.platform }}
          path: binary/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Download and verify existing binary
        if: inputs.mode == 'test'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_OWNER: ${{ secrets.USER }}
        run: node builder/.github/scripts/expo-e2e/reuse.cjs
      - name: Install pinned Maestro CLI
        if: inputs.mode != 'build'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable Android emulator acceleration
        if: inputs.mode != 'build' && inputs.platform == 'android'
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android
        if: inputs.mode != 'build' && inputs.platform == 'android'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash builder/.github/scripts/expo-e2e/test.sh
      - name: Test iOS
        if: inputs.mode != 'build' && inputs.platform == 'ios'
        timeout-minutes: 20
        env:
          # A cold XCUITest driver can exceed Maestro's default 120 seconds on CI.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
        run: bash builder/.github/scripts/expo-e2e/test.sh
      - name: Upload test reports and screenshots
        if: always() && inputs.mode != 'build'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: expo-e2e-results-${{ inputs.platform }}
          path: results/
          if-no-files-found: warn
          retention-days: 14
      - name: Write summary
        if: always()
        run: |
          node builder/.github/scripts/expo-e2e/summary.cjs
