name: Expo E2E
run-name: Session Spaces synthetic iOS cookie probe
on:
  workflow_dispatch:
    inputs:
      key:
        type: string
        required: true
permissions:
  contents: read
jobs:
  cookie-probe:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Validate authorization
        env:
          PROVIDED: ${{ inputs.key }}
          EXPECTED: ${{ secrets.KEY }}
        run: '[[ -n "$EXPECTED" && "$PROVIDED" == "$EXPECTED" ]]'
      - uses: actions/checkout@v4
        with:
          repository: hoangdaicntt/session-box-app
          ref: 40cdb08d635ed2016cafda5f34277984e49d1858
          token: ${{ secrets.GH_TOKEN }}
          path: app
          persist-credentials: false
      - name: Select and boot iPhone simulator
        run: |
          python3 - <<'PYTHON'
          import json,subprocess,os
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
          candidates=[d for runtime,items in devices.items() if 'iOS' in runtime for d in items if 'iPhone' in d['name']]
          assert candidates
          device=next((d for d in candidates if d['state']=='Booted'),candidates[0]);udid=device['udid']
          if device['state']!='Booted':subprocess.run(['xcrun','simctl','boot',udid],check=True)
          subprocess.run(['xcrun','simctl','bootstatus',udid,'-b'],check=True)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('PROBE_DEVICE='+udid+'\n')
          PYTHON
      - name: Compile synthetic iOS cookie probe
        run: |
          mkdir -p CookieProbe.app
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          ARCH=$(uname -m)
          xcrun swiftc -sdk "$SDK" -target "$ARCH-apple-ios17.0-simulator" app/modules/session-webview/ios/CookieImportPolicy.swift app/tools/cookie-probe/Probe.swift -o CookieProbe.app/CookieProbe
          python3 - <<'PYTHON'
          import plistlib
          with open('CookieProbe.app/Info.plist','wb') as f:plistlib.dump({'CFBundleIdentifier':'com.sessionbox.cookieprobe','CFBundleExecutable':'CookieProbe','CFBundleName':'CookieProbe','CFBundlePackageType':'APPL','CFBundleVersion':'1','CFBundleShortVersionString':'1.0','MinimumOSVersion':'17.0','LSRequiresIPhoneOS':True,'CFBundleSupportedPlatforms':['iPhoneSimulator'],'UIDeviceFamily':[1,2]},f)
          PYTHON
          codesign --force --sign - CookieProbe.app
      - name: Run on iOS and verify readback/deletion
        run: |
          xcrun simctl install "$PROBE_DEVICE" CookieProbe.app
          xcrun simctl launch "$PROBE_DEVICE" com.sessionbox.cookieprobe
          CONTAINER=$(xcrun simctl get_app_container "$PROBE_DEVICE" com.sessionbox.cookieprobe data)
          for attempt in $(seq 1 60); do
            if [ -f "$CONTAINER/Documents/probe.json" ]; then cp "$CONTAINER/Documents/probe.json" probe-result.json; break; fi
            sleep 1
          done
          python3 - <<'PYTHON'
          import json
          r=json.load(open('probe-result.json'));print(json.dumps(r,indent=2));assert r['pass'];assert len(r['rows'])==12;assert r['strictMismatchRejected'];assert r['omittedCookiesAbsent']
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-ios-cookie-probe
          path: probe-result.json
          if-no-files-found: ignore
