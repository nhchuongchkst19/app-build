name: Delete old workflow runs

on:
  schedule:
    - cron: '0 0 * * *' # Daily at 07:00 Vietnam time (UTC+7).
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  del_runs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete completed runs, retaining reusable Expo binaries for 14 days
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const { owner, repo } = context.repo;
            // Gather before deleting so pagination cannot skip runs.
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, per_page: 100,
            });
            const cutoff = Date.now() - 14 * 24 * 60 * 60 * 1000;
            for (const run of runs) {
              if (run.status !== 'completed' || run.id === context.runId) continue;
              if (run.path === '.github/workflows/expo-e2e.yml'
                  && Date.parse(run.created_at) >= cutoff) continue;
              await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
            }
